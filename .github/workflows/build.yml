name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: YubAI-DramaFlow-${{ github.ref_name }}.AppImage
          - os: windows-2022
            platform: win
            artifact: YubAI-DramaFlow-Setup-${{ github.ref_name }}.exe
          - os: macos-14
            platform: mac
            artifact: YubAI-DramaFlow-${{ github.ref_name }}.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }}
        run: npm run build -- --${{ matrix.platform }}
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron_cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron_builder_cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: dist/**/*
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload to Alibaba Cloud
        run: |
          curl -T artifacts/linux-artifact/*.AppImage http://39.107.251.193:8000/client/YubAI-DramaFlow-${{ github.ref_name }}.AppImage
        continue-on-error: true

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Get version from workflow_dispatch input (falls back to ref_name which is 'master' for workflow_dispatch)
            let version = github.event.inputs?.version 
              || github.context.ref_name.replace('refs/tags/', '');
            version = version.startsWith('v') ? version : 'v' + version;
            const releaseName = 'YubAI DramaFlow ' + version;
            const releaseTag = version;
            
            // Delete existing release if any
            const existingReleases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            let releaseId;
            for (const rel of existingReleases.data) {
              if (rel.tag_name === releaseTag) {
                console.log(`Found existing release ${rel.id}, deleting...`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: rel.id
                });
                break;
              }
            }
            
            // Also delete existing tag ref
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${releaseTag}`
              });
              console.log(`Deleted tag ref: ${releaseTag}`);
            } catch(e) {
              console.log(`Tag delete: ${e.message}`);
            }
            
            // Create new release
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: releaseTag,
              name: releaseName,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            });
            
            console.log(`Created release ${release.data.id}: ${release.data.html_url}`);
            
            // Upload assets
            const artifactsDir = 'artifacts';
            const dirs = fs.readdirSync(artifactsDir);
            for (const dir of dirs) {
              const dirPath = path.join(artifactsDir, dir);
              if (!fs.statSync(dirPath).isDirectory()) continue;
              const files = fs.readdirSync(dirPath);
              for (const file of files) {
                const filePath = path.join(dirPath, file);
                const stat = fs.statSync(filePath);
                console.log(`Uploading ${file} (${stat.size} bytes)...`);
                try {
                  const fileContent = fs.readFileSync(filePath);
                  await github.rest.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.data.id,
                    name: file,
                    data: fileContent,
                    headers: {
                      'Content-Type': 'application/octet-stream',
                      'Content-Length': fileContent.length
                    }
                  });
                  console.log(`  ✅ ${file}`);
                } catch(e) {
                  console.log(`  ❌ ${file}: ${e.message}`);
                }
              }
            }
