name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --registry https://registry.npmmirror.com

      - name: Build ${{ matrix.platform }}
        run: npm run build -- --${{ matrix.platform }} --registry https://registry.npmmirror.com
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron_cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron_builder_cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: |
            dist/**/*
            !dist/**/*.blockmap
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts/ -type f | head -30

      - name: Upload to Alibaba Cloud
        run: |
          curl -T artifacts/linux-artifact/*.AppImage http://39.107.251.193:8000/client/YubAI-DramaFlow-${{ github.ref_name }}.AppImage
        continue-on-error: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          RELEASE_ID: ${{ vars.RELEASE_ID }}
        run: python3 .github/workflows/release.py
