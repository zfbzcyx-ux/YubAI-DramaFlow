name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: YubAI-DramaFlow-${{ github.ref_name }}.AppImage
          - os: windows-2022
            platform: win
            artifact: YubAI-DramaFlow-Setup-${{ github.ref_name }}.exe
          - os: macos-14
            platform: mac
            artifact: YubAI-DramaFlow-${{ github.ref_name }}.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }}
        run: npm run build -- --${{ matrix.platform }}
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron_cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron_builder_cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: dist/**/*
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload to Alibaba Cloud
        run: |
          curl -T artifacts/linux-artifact/*.AppImage http://39.107.251.193:8000/client/YubAI-DramaFlow-${{ github.ref_name }}.AppImage
        continue-on-error: true

      - name: Create GitHub Release
        run: |
          VERSION=${{ github.ref_name }}
          echo "Creating release for $VERSION"
          
          # Delete existing release if any
          EXISTING=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | \
            python3 -c "import sys,json; releases=[r for r in json.load(sys.stdin) if r['tag_name']=='$VERSION']; print(releases[0]['id'] if releases else '')")
          
          if [ -n "$EXISTING" ]; then
            echo "Deleting existing release $EXISTING..."
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$EXISTING"
          fi
          
          # Delete tag ref if exists
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$VERSION" || true
          
          # Create release
          RELEASE_RESP=$(curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$VERSION\",\"name\":\"YubAI DramaFlow $VERSION\",\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          
          RELEASE_ID=$(echo "$RELEASE_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Created release ID: $RELEASE_ID"
          
          # Upload all artifacts
          for file in artifacts/linux-artifact/*.AppImage artifacts/windows-artifact/*.exe artifacts/macos-artifact/*.dmg; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              FILENAME=$(basename "$file")
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FILENAME"
              echo " ✅ $FILENAME"
            fi
          done
